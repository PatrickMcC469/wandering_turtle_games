<title>Font pairings — WTG</title>
<!-- Samples load from Google Fonts for comparison only. The chosen pair
     gets self-hosted as woff2 in site/fonts/ (decision 2026-09-21). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Grandstander:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Chewy&family=Nunito+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1e27; --navy-teal: #12343e; --mint: #559d7d; --mint-light: #8fd1b0;
    --cream: #e9efe9; --cream-dim: #b7c4bd; --tan: #c9b58a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); color: var(--cream); padding: 24px 16px; }
  .sample { max-width: 420px; margin: 0 auto 56px; border: 1px solid var(--navy-teal); border-radius: 16px; padding: 24px 20px; }
  .label { font: 700 12px/1 monospace; color: var(--tan); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px; }
  .hero { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
  .hero img { width: 88px; height: 88px; border-radius: 50%; flex: none; }
  h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.1; color: var(--mint-light); }
  .tag { margin: 0; font-size: 16px; line-height: 1.4; color: var(--cream-dim); }
  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tan); margin: 0 0 12px; font-weight: 700; }
  .card { background: var(--navy-teal); border-radius: 12px; padding: 16px; }
  h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.15; color: var(--mint-light); }
  p { margin: 0 0 12px; font-size: 16px; line-height: 1.55; }
  .meta { font-size: 14px; color: var(--cream-dim); font-style: italic; }
  .btn { display: inline-block; margin-top: 8px; padding: 10px 16px; border-radius: 999px; background: var(--mint-light); color: var(--navy); font-weight: 700; font-size: 15px; text-decoration: none; }

  .a h1, .a h3 { font-family: 'Fredoka', sans-serif; font-weight: 600; }
  .a p, .a .tag, .a .btn, .a h2 { font-family: 'Nunito', sans-serif; }

  .b h1, .b h3 { font-family: 'Baloo 2', sans-serif; font-weight: 700; }
  .b p, .b .tag, .b .btn, .b h2 { font-family: 'Source Sans 3', sans-serif; }

  .c h1, .c h3 { font-family: 'Grandstander', sans-serif; font-weight: 700; }
  .c p, .c .tag, .c .btn, .c h2 { font-family: 'Atkinson Hyperlegible', sans-serif; }

  .d h1, .d h3 { font-family: 'Zilla Slab', serif; font-weight: 700; }
  .d p, .d .tag, .d .btn, .d h2 { font-family: 'Lora', serif; }
  .d .btn { font-family: 'Zilla Slab', serif; }

  .e h1, .e h3 { font-family: 'Chewy', cursive; font-weight: 400; letter-spacing: .01em; }
  .e p, .e .tag, .e .btn, .e h2 { font-family: 'Nunito Sans', sans-serif; }
</style>
</head>
